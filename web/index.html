<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cábula</title>
<link rel="icon" href="data:,">
<style>
:root {
    --primary: #2a78d6;
    --accent: #1baf7a;
    --negative: #d03b3b;
    --warning: #c98500;
    --bg: #f4f5f7;
    --card-bg: rgba(255,255,255,0.75);
    --text: #1a1a19;
    --text-dim: #666;
    --border: rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0d0d0d;
        --card-bg: rgba(30,30,30,0.65);
        --text: #f0f0f0;
        --text-dim: #aaa;
        --border: rgba(255,255,255,0.1);
    }
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}
header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}
header h1 {
    font-size: 1.4rem;
    margin: 0;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
nav {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
    flex-wrap: wrap;
}
nav button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
}
nav button.active { background: var(--primary); color: white; border-color: var(--primary); }
main { padding: 0 20px 40px; max-width: 900px; margin: 0 auto; }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
input, select, textarea {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.95rem;
}
input[type=search] { flex: 1; min-width: 180px; }
button.primary {
    background: var(--primary); color: white; border: none;
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
button.ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    backdrop-filter: blur(8px);
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.mono { font-family: "SF Mono", Consolas, monospace; font-size: 0.92rem; word-break: break-all; }
.badge {
    display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 10px;
    background: var(--border); color: var(--text-dim); margin-right: 6px;
}
.actions { display: flex; gap: 6px; flex-shrink: 0; }
.actions button { background: transparent; border: none; cursor: pointer; font-size: 1rem; color: var(--text-dim); }
.actions button:hover { color: var(--text); }
.desc { color: var(--text-dim); font-size: 0.88rem; margin-top: 4px; }
.step { margin: 4px 0 4px 12px; padding-left: 10px; border-left: 2px solid var(--border); }
.empty { color: var(--text-dim); text-align: center; padding: 40px 0; }
dialog {
    border: none; border-radius: 12px; padding: 20px; width: min(480px, 92vw);
    background: var(--bg); color: var(--text);
}
dialog::backdrop { background: rgba(0,0,0,0.5); }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.form-row label { font-size: 0.8rem; color: var(--text-dim); }
.form-row input, .form-row select, .form-row textarea { width: 100%; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.steps-editor .step-row { display: flex; gap: 6px; margin-bottom: 6px; }
.steps-editor .step-row input { flex: 1; }
#toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: white; padding: 10px 18px; border-radius: 8px;
    display: none; z-index: 999;
}
</style>
</head>
<body>
<header>
    <h1>Cábula</h1>
    <div class="toolbar" style="margin-bottom:0">
        <button class="ghost" id="pin-btn">🔒 PIN</button>
    </div>
</header>
<nav id="tabs">
    <button data-tab="commands" class="active">Comandos</button>
    <button data-tab="scenarios">Cenários</button>
    <button data-tab="glossary">Glossário</button>
</nav>
<main>
    <div class="toolbar">
        <input type="search" id="search" placeholder="Pesquisar...">
        <select id="category-filter"><option value="">Todas as categorias</option></select>
        <button class="primary" id="add-btn">+ Novo</button>
    </div>
    <div id="list"></div>
</main>

<dialog id="pin-dialog">
    <h3>PIN de edição</h3>
    <div class="form-row">
        <label>PIN</label>
        <input type="password" id="pin-input">
    </div>
    <div class="dialog-actions">
        <button class="ghost" id="pin-cancel">Cancelar</button>
        <button class="primary" id="pin-save">Guardar</button>
    </div>
</dialog>

<dialog id="item-dialog"></dialog>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
