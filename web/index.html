<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cábula</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #4a9eff;
    --accent: #1baf7a;
    --negative: #e05a5a;
    --warning: #c98500;
    --bg: #0f1115;
    --sidebar-bg: #131519;
    --card-bg: #181a21;
    --text: #e8e9ec;
    --text-dim: #8a8f98;
    --border: #262931;
    --hover: #1e212a;
    --code-bg: #1f222b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
}
@media (prefers-color-scheme: light) {
    :root {
        --bg: #f7f8fa;
        --sidebar-bg: #ffffff;
        --card-bg: #ffffff;
        --text: #16181d;
        --text-dim: #6b7280;
        --border: #e5e7eb;
        --hover: #f0f2f5;
        --code-bg: #f1f3f6;
        --shadow: 0 1px 2px rgba(16,24,40,0.05);
    }
}
* { box-sizing: border-box; }
html { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
}
.brand {
    padding: 18px 18px 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
}
.brand .logo {
    font-size: 1.15rem; width: 32px; height: 32px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
}
.brand h1 {
    font-size: 1.1rem; margin: 0; font-weight: 700; letter-spacing: -0.01em;
    background: linear-gradient(90deg, var(--text), var(--text-dim));
    -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- Nav tree ---------- */
.nav-tree { list-style: none; margin: 6px 0 0; padding: 0 10px 0 22px; }
.nav-tree .nav-tree { margin: 0; padding-left: 22px; }
.nav-tree li { position: relative; padding-left: 14px; }
.nav-tree li::before {
    content: ""; position: absolute; left: 0; top: 0; height: 15px; width: 12px;
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.nav-tree li::after {
    content: ""; position: absolute; left: 0; top: 15px; bottom: -2px; width: 1px; background: var(--border);
}
.nav-tree li:last-child::after { display: none; }
.nav-item.sub { font-size: 0.83rem; color: var(--text-dim); }
.nav-item.sub.active { color: white; }
.nav-item {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    width: calc(100% - 2px); text-align: left; background: none; border: none; cursor: pointer;
    color: var(--text); font-size: 0.87rem; padding: 6px 8px; border-radius: 6px;
    font-family: inherit; margin: 1px 0 1px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background 0.12s, color 0.12s;
}
.nav-item .icon { flex-shrink: 0; }
.nav-item .count { margin-left: auto; font-size: 0.72rem; color: var(--text-dim); flex-shrink: 0; }
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--primary); color: white; font-weight: 500; }
.nav-item.active .count { color: rgba(255,255,255,0.75); }
.nav-item.active::before {
    content: ""; position: absolute; left: -4px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 60%; border-radius: 2px; background: var(--accent);
}

.sidebar-footer { margin-top: auto; padding: 14px; border-top: 1px solid var(--border); }
.pin-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 8px; cursor: pointer; font-size: 0.85rem; font-family: inherit;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.pin-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--hover); }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; }
.topbar {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex; gap: 10px; align-items: center;
}
.search-wrap { position: relative; flex: 1; max-width: 480px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.45; pointer-events: none; }
#search {
    width: 100%; padding: 9px 12px 9px 36px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.92rem;
    font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
}
#search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
button.primary {
    background: var(--primary); color: white; border: none;
    border-radius: 9px; padding: 9px 16px; cursor: pointer; font-size: 0.88rem; font-weight: 500;
    font-family: inherit; white-space: nowrap; transition: filter 0.15s, transform 0.1s;
}
button.primary:hover { filter: brightness(1.1); }
button.primary:active { transform: scale(0.97); }
button.ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 9px 14px; cursor: pointer; font-family: inherit; font-size: 0.88rem;
    transition: border-color 0.15s, background 0.15s;
}
button.ghost:hover { border-color: var(--text-dim); background: var(--hover); }

.content { padding: 24px 32px 60px; max-width: 880px; }
.breadcrumb { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 14px; }
.breadcrumb b { color: var(--text); font-weight: 600; }

/* ---------- Entry cards (wiki-article feel) ---------- */
.entry {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    animation: entry-in 0.2s ease both;
}
.entry:hover {
    border-color: color-mix(in srgb, var(--primary) 35%, var(--border));
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transform: translateY(-1px);
}
@keyframes entry-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.entry-body { flex: 1; min-width: 0; }
.badge {
    display: inline-block; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 2px 8px; border-radius: 5px;
    background: var(--code-bg); color: var(--text-dim); margin-bottom: 6px;
}
.mono {
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 0.9rem;
    background: var(--code-bg); padding: 6px 10px; border-radius: 6px; display: inline-block;
    word-break: break-all; margin: 2px 0;
}
.entry-title { font-size: 1rem; font-weight: 600; margin: 0 0 4px; }
.desc { color: var(--text-dim); font-size: 0.87rem; margin-top: 4px; line-height: 1.5; }
.tags-line { font-size: 0.78rem; color: var(--text-dim); margin-top: 6px; }
.step {
    margin: 8px 0 0 2px; padding: 8px 0 8px 12px; border-left: 2px solid var(--border);
}
.step:first-of-type { margin-top: 10px; }
.step-copy {
    background: transparent; border: none; cursor: pointer; font-size: 0.85rem; color: var(--text-dim);
    padding: 2px 4px; border-radius: 5px; line-height: 1; flex-shrink: 0;
}
.step-copy:hover { color: var(--text); background: var(--hover); }
.tpl-vars {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px 14px; margin: 12px 0 6px; padding: 14px; border-radius: 10px; background: var(--code-bg);
}
.tpl-var-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tpl-var-field label {
    font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    display: flex; align-items: center; gap: 5px;
}
.tpl-hint {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--text-dim);
    color: var(--text-dim); font-size: 0.62rem; font-weight: 700; text-transform: none;
    cursor: help; flex-shrink: 0; letter-spacing: 0;
}
.tpl-hint:hover { border-color: var(--primary); color: var(--primary); }
.tpl-control {
    display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 7px;
    background: var(--card-bg); overflow: hidden; transition: border-color 0.15s;
}
.tpl-control:focus-within { border-color: var(--primary); }
.tpl-control input, .tpl-control select {
    flex: 1; min-width: 0; border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 0.83rem; padding: 7px 9px; height: 32px;
}
.tpl-control input:focus, .tpl-control select:focus { outline: none; }
.tpl-control-btn {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 30px; border: none; border-left: 1px solid var(--border); background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: 0.85rem;
}
.tpl-control-btn:hover { color: var(--text); background: var(--hover); }
.tpl-empty { color: var(--warning); border-bottom: 1px dashed var(--warning); }
.tpl-filled { color: var(--accent); font-weight: 600; }
.actions { display: flex; gap: 2px; flex-shrink: 0; }
.actions button {
    background: transparent; border: none; cursor: pointer; font-size: 0.95rem; color: var(--text-dim);
    padding: 5px; border-radius: 6px; line-height: 1; transition: background 0.12s, color 0.12s, transform 0.1s;
}
.actions button:hover { color: var(--text); background: var(--hover); transform: scale(1.08); }
.empty {
    color: var(--text-dim); text-align: center; padding: 70px 0; font-size: 0.92rem;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty .empty-icon { font-size: 1.8rem; opacity: 0.5; }
.spinner {
    width: 22px; height: 22px; margin: 0 auto; border-radius: 50%;
    border: 2.5px solid var(--border); border-top-color: var(--primary);
    animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Dialogs ---------- */
dialog {
    border: none; border-radius: 14px; padding: 24px; width: min(480px, 92vw);
    background: var(--card-bg); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: dialog-in 0.16s ease both;
}
dialog[open]::backdrop { animation: backdrop-in 0.16s ease both; }
@keyframes dialog-in { from { opacity: 0; transform: scale(0.97) translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
dialog h3 { margin-top: 0; font-size: 1.05rem; }
dialog::backdrop { background: rgba(8,9,12,0.55); backdrop-filter: blur(3px); }
.form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.form-row label { font-size: 0.78rem; color: var(--text-dim); font-weight: 500; }
.form-row input, .form-row textarea, .form-row select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 0.9rem;
    transition: border-color 0.15s;
}
.form-row input:focus, .form-row textarea:focus { outline: none; border-color: var(--primary); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.steps-editor .step-row { display: flex; gap: 6px; margin-bottom: 6px; }
.steps-editor .step-row input { flex: 1; }

#toast {
    position: fixed; bottom: 24px; left: 50%;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
    display: none; z-index: 999; font-size: 0.88rem; box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
#toast.show { display: block; animation: toast-in 0.2s ease both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Mobile ---------- */
.menu-toggle { display: none; }
@media (max-width: 820px) {
    .sidebar {
        position: fixed; left: 0; top: 0; z-index: 20; transform: translateX(-100%);
        transition: transform 0.2s ease; box-shadow: 0 0 30px rgba(0,0,0,0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border: 1px solid var(--border); border-radius: 8px;
        width: 38px; height: 38px; cursor: pointer; color: var(--text); flex-shrink: 0;
    }
    .topbar { padding: 14px 16px; }
    .content { padding: 18px 16px 50px; }
    .sidebar-backdrop {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 15;
    }
    .sidebar-backdrop.open { display: block; }
}
</style>
</head>
<body>
<div class="app">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="logo">📖</span><h1>Cábula</h1></div>

        <ul class="nav-tree" id="nav-tree"></ul>

        <div class="sidebar-footer">
            <button class="pin-btn" id="export-btn">⬇️ Exportar JSON</button>
            <button class="pin-btn" id="import-btn" style="margin-top:8px">⬆️ Importar JSON</button>
            <input type="file" id="import-file" accept="application/json" hidden>
            <button class="pin-btn" id="pin-btn" style="margin-top:8px">🔒 PIN de edição</button>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <div class="search-wrap">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" id="search" placeholder="Pesquisar...">
            </div>
            <button class="primary" id="add-btn">+ Novo</button>
        </div>
        <div class="content">
            <div class="breadcrumb" id="breadcrumb"></div>
            <div id="list"></div>
        </div>
    </div>
</div>

<dialog id="pin-dialog">
    <h3>PIN de edição</h3>
    <div class="form-row">
        <label>PIN</label>
        <input type="password" id="pin-input">
    </div>
    <div class="dialog-actions">
        <button class="ghost" id="pin-cancel">Cancelar</button>
        <button class="primary" id="pin-save">Guardar</button>
    </div>
</dialog>

<dialog id="item-dialog"></dialog>

<dialog id="paste-dialog">
    <h3>Colar output do comando</h3>
    <p class="desc" id="paste-suggestion" style="margin-top:-6px;margin-bottom:10px"></p>
    <div class="form-row">
        <label>Cola aqui o resultado</label>
        <textarea id="paste-textarea" rows="10" style="font-family:'JetBrains Mono',monospace;font-size:0.82rem"></textarea>
    </div>
    <div class="dialog-actions">
        <button class="ghost" id="paste-cancel">Cancelar</button>
        <button class="primary" id="paste-use">Criar lista</button>
    </div>
</dialog>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
